[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendan-jarvis"
version = "0.1.0"
description = "Jarvis Agent - A personal assistant agent built on OpenDAN"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "OpenDAN Team", email = "team@opendan.org"}
]
requires-python = ">=3.13"
dependencies = [
    "opendan>=0.1.0",
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
jarvis = "jarvis:main"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]

[tool.pytest.ini_options]
testpaths = ["../../../test"]
python_files = ["test_jarvis*.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.ruff]
target-version = "py313"
line-length = 88
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]


